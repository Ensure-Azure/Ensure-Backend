name: Deploy a Azure App Service

on:
  push:
    branches:
      - main # O tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    # Aquí compilas/construyes tu proyecto (Node, .NET, Python, etc.)   
    # ...

    - name: Desplegar en Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'appservicecentineladev'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}